# Builds the Windows installer and the macOS disk image on real Windows / macOS runners.
# It runs ONLY when you start it by hand (Actions tab -> Build installers -> Run workflow) or push a version tag such as v1.0.0.
# A tag push additionally publishes the two files as a GitHub release; a manual run only keeps them as downloadable artifacts.
name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests/test_hw.py tests/test_presets.py -q
      - run: choco install innosetup -y --no-progress
      - name: Build exe and installer
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File packaging\build.ps1
      - name: Collect installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item "$env:APPDATA\OrbSim\build\installer\*.exe" release\
      - uses: actions/upload-artifact@v4
        with: { name: windows-installer, path: release/*.exe }

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 -m pip install -r requirements-dev.txt
      - run: python3 -m pytest tests/test_hw.py tests/test_presets.py -q
      - name: Build app and disk image
        run: bash packaging/build_mac.sh
      - name: Collect disk image
        run: |
          mkdir -p release
          cp "$HOME/Library/Application Support/OrbSim/build/installer/"*.dmg release/
      - uses: actions/upload-artifact@v4
        with: { name: macos-dmg, path: release/*.dmg }

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: release, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
