<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OrbSim</title>
<link rel="stylesheet" href="/style.css">
<script type="importmap">{"imports":{"three":"/vendor/three.module.min.js"}}</script>
<script>
/* apply the saved appearance before first paint (no flash): settings come from the app data folder via /api/meta, so this only
   follows the operating-system preference until the real setting arrives */
document.documentElement.dataset.boot = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
</script>
</head>
<body data-theme="dark">
<div id="busybar" class="busybar" role="status"><i></i><span></span></div>
<div id="splash">
  <div class="sp-box">
    <svg class="sp-logo" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#0f1628"/><rect x="1.5" y="1.5" width="61" height="61" rx="13" fill="none" stroke="#2c4380" stroke-width="1.2"/>
      <ellipse cx="32" cy="32" rx="22" ry="11.5" transform="rotate(-28 32 32)" fill="none" stroke="#ff6b4a" stroke-width="2.6"/><circle cx="25.5" cy="35.5" r="6.5" fill="#4c8df6"/><circle cx="46" cy="22" r="2.7" fill="#f5b73b"/></svg>
    <div class="sp-t">OrbSim</div>
    <div class="sp-bar"><i id="splash-bar"></i></div>
    <div class="sp-row"><span id="splash-msg">starting</span><span id="splash-pct">0%</span></div>
  </div>
</div>
<div id="app">
  <header id="top">
    <div class="brand"><button class="logobtn" id="logoBtn" title="orbsim menu (hover, or click to keep it open)" aria-label="OrbSim menu"><svg class="applogo" viewBox="0 0 64 64" aria-hidden="true"><ellipse cx="32" cy="32" rx="25" ry="13" transform="rotate(-28 32 32)" fill="none" stroke="var(--orange)" stroke-width="4"/><circle cx="25.5" cy="35.5" r="8" fill="var(--blue)"/><circle cx="47" cy="21" r="3.4" fill="var(--amber)"/></svg></button><div id="menubar" role="menubar"></div><div id="modesw" class="modesw" role="tablist"></div><span class="pill" id="fpsb" hidden></span></div>
    <div class="top-right">
      <button class="chip" id="unitChip">Units: km · s</button>
      <button class="chip setbtn" id="setBtn" title="preferences (F9)">Preferences</button>
    </div>
  </header>
  <nav id="nav"></nav>
  <section id="panel"></section>
  <main id="main"></main>
  <div class="split v" id="sp1" title="drag to resize · double-click to reset"></div>
  <div class="split v" id="sp2" title="drag to resize · double-click to reset"></div>
</div>
<div class="spin" id="spin">Solving…</div>
<div id="toast" role="status"></div>
<script src="/textcase.js"></script>
<script src="/app.js"></script>
<script src="/dock.js"></script>
<script src="/mission.js"></script>
<script src="/explore.js"></script>
<script src="/icons.js"></script>
<script src="/tour.js"></script>
<script src="/appmenu.js"></script>
</body>
</html>
